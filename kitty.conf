shell zsh --login --interactive
font_family family=Iosevka postscript_name=Iosevka-Extended
bold_font Iosevka-Extended Medium
italic_font Iosevka-Extended Italic
bold_italic_font Iosevka-Extended Medium Italic
font_size 16.0

cursor_blink_interval 0

scrollback_lines 20000

wheel_scroll_multiplier 2.0
wheel_scroll_min_lines 1
touch_scroll_multiplier 1.0

remember_window_size  no
initial_window_width  85c
initial_window_height 24c

enabled_layouts horizontal

map ctrl+shift+enter launch --cwd=current
map ctrl+shift+n new_os_window_with_cwd
map cmd+n new_os_window_with_cwd
map cmd+enter launch --cwd=current


allow_remote_control socket-only
listen_on unix:/tmp/kitty
